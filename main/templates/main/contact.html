{% extends 'main/base.html' %}

{% block title %}Contact | GameDayPicks{% endblock %}

{% block content %}
<div class="narrow">
    <h1>Contact us</h1>
    <p class="muted">Have a question, spotted a problem, or got an idea? We'd love to hear from you.</p>

    <form class="form card" method="post">
        {% csrf_token %}
        <p>
            <label for="contact-name">Your name</label>
            <input type="text" id="contact-name" name="name" maxlength="100" autocomplete="name" required>
        </p>
        <p>
            <label for="contact-email">Email address</label>
            <input type="email" id="contact-email" name="email" maxlength="254" autocomplete="email" required>
        </p>
        <p>
            <label for="contact-subject">Subject</label>
            <input type="text" id="contact-subject" name="subject" maxlength="150" required>
        </p>
        <p>
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="6" maxlength="5000" required></textarea>
        </p>
        <button type="submit" class="btn btn-red">Send message</button>
    </form>
</div>
{% endblock %}
