{% extends 'main/base.html' %}
{% block content %}
    <div class="profile-actions">
        <a href="{% url 'profile' %}" class="profile-text-link">
            My Profile <span aria-hidden="true">→</span>
        </a>
    </div>
    <div class="user-stats">
        <h1>Your Activity — {{ selected_season }} Season</h1>

        <div class="record-section">
            <h3>Your Record</h3>

            <form method="get" class="record-filter">
                <label for="season">Season:</label>
                <select name="season" id="season" onchange="this.form.submit()">
                    {% for season in seasons %}
                        <option value="{{ season }}"
                            {% if selected_season == season %}selected{% endif %}>
                            {{ season }} Season
                        </option>
                    {% endfor %}
                </select>

                <label for="record_week">View record:</label>
                <select name="record_week" id="record_week" onchange="this.form.submit()">
                    <option value="season"
                        {% if record_week == 'season' %}selected{% endif %}>
                        Season Overall
                    </option>
                    {% for week in weeks %}
                        <option value="{{ week }}"
                            {% if record_week == week|stringformat:"s" %}selected{% endif %}>
                            Week {{ week }}
                        </option>
                    {% endfor %}
                </select>

                <noscript>
                    <button type="submit">Show Record</button>
                </noscript>
            </form>

            <div class="stats-container">
                <div class="stats-item stats-wins">
                    <span class="stats-label">Wins</span>
                    <span class="stats-number">{{ user_stats.wins }}</span>
                </div>
                <div class="stats-item stats-losses">
                    <span class="stats-label">Losses</span>
                    <span class="stats-number">{{ user_stats.losses }}</span>
                </div>
                <div class="stats-item stats-ties">
                    <span class="stats-label">Ties</span>
                    <span class="stats-number">{{ user_stats.ties }}</span>
                </div>
            </div>
        </div>

        <div class="activity-actions">
            <a href="{% url 'picks' %}?season={{ selected_season }}" class="dashboard-primary-button">MAKE PICKS</a>
            <a href="{% url 'leaderboard' %}?season={{ selected_season }}" class="dashboard-secondary-button">VIEW LEADERBOARD</a>
        </div>
    </div>
{% endblock %}
